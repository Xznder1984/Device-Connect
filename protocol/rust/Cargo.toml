[package]
name = "dc-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Device Connect shared protocol codec: framing, record layer, QR pairing payloads, confirmation codes, Noise XX handshake helpers"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
thiserror = "2"
snow = "0.9"

[dev-dependencies]
hex = "0.4"
